# Reverse proxy VM: terminates TLS for classroom.aiims.app and forwards to the
# application VM. Run this on the NGINX VM, not the app VM.
# Replace APP_VM_IP with the application VM's private (or public) IP.

server {
    listen 80;
    listen [::]:80;
    server_name classroom.aiims.app;

    # certbot renewals
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name classroom.aiims.app;

    ssl_certificate     /etc/letsencrypt/live/classroom.aiims.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classroom.aiims.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enable once HTTPS is confirmed working; sticky in browsers.
    #add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 6m;             # question images up to 5 MB

    location / {
        proxy_pass http://APP_VM_IP:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;    # TLS terminates here
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
